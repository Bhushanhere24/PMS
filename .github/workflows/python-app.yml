    - name: Deploy to PythonAnywhere
      if: github.ref == 'refs/heads/main' && success()
      env:
        PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
      run: |
        pip install --upgrade pythonanywhere
        python -m pythonanywhere.deploy --username $PA_USERNAME --api_token $PA_API_TOKEN --site $PA_USERNAME.pythonanywhere.com --path .
name: Python application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run backend tests
      run: |
        python test_patient_manager.py
    - name: Run web API tests
      run: |
        python test_web.py
